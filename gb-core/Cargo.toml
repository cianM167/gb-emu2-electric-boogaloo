[package]
name = "gb-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde-big-array = { version = "0.5.1", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
anyhow = { version = "1.0.104", optional = true }
wasmtime = { version = "49.0.1", optional = true }
ringbuf = { version = "0.5.2", optional = true }
spin = { version = "0.9", default-features = false, features = ["once"] }

[features]
default = ["std", "wasm-plugins"]
std = ["serde/std", "postcard/use-std", "serde_json/std"]
wasm-plugins = ["std", "dep:wasmtime", "dep:anyhow", "dep:ringbuf"]